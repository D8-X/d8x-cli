name: Release

on:
  push:
    tags: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: d8x-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: d8x-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: d8x-macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o d8x \
            -ldflags='-X "github.com/D8-X/d8x-cli/internal/version.commit=${{ github.sha }}" -X "github.com/D8-X/d8x-cli/internal/version.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"' \
            main.go
      - name: Sign binary (macOS)
        if: startsWith(matrix.goos, 'darwin')
        run: codesign -s - d8x
      - name: Package
        run: tar -czvf ${{ matrix.name }}.tar.gz d8x
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*.tar.gz"
