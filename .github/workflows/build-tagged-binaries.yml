name: Release

on:
  push:
    tags: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: d8x-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: d8x-macos-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: d8x-macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o d8x \
            -ldflags='-X "github.com/D8-X/d8x-cli/internal/version.version=${{ github.ref_name }}"' \
            main.go
      - name: Sign binary (macOS)
        if: startsWith(matrix.goos, 'darwin')
        run: codesign -s - d8x
      - name: Package
        run: tar -czvf ${{ matrix.name }}.tar.gz d8x
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*.tar.gz"

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        run: sleep 10
      - name: Compute SHA256 hashes
        run: |
          VERSION="${{ github.ref_name }}"
          curl -sL "https://github.com/D8-X/d8x-cli/releases/download/${VERSION}/d8x-macos-arm64.tar.gz" -o arm64.tar.gz
          curl -sL "https://github.com/D8-X/d8x-cli/releases/download/${VERSION}/d8x-macos-amd64.tar.gz" -o amd64.tar.gz
          curl -sL "https://github.com/D8-X/d8x-cli/releases/download/${VERSION}/d8x-linux-amd64.tar.gz" -o linux.tar.gz
          echo "SHA_ARM64=$(sha256sum arm64.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA_AMD64=$(sha256sum amd64.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA_LINUX=$(sha256sum linux.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          repository: D8-X/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/d8x.rb << FORMULA
          class D8x < Formula
            desc "CLI for provisioning, deploying, and managing D8X trader backend infrastructure"
            homepage "https://github.com/D8-X/d8x-cli"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/D8-X/d8x-cli/releases/download/${{ github.ref_name }}/d8x-macos-arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/D8-X/d8x-cli/releases/download/${{ github.ref_name }}/d8x-macos-amd64.tar.gz"
                sha256 "${SHA_AMD64}"
              end
            end

            on_linux do
              url "https://github.com/D8-X/d8x-cli/releases/download/${{ github.ref_name }}/d8x-linux-amd64.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "d8x"
            end

            test do
              system "#{bin}/d8x", "--version"
            end
          end
          FORMULA
      - name: Push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/d8x.rb
          git diff --cached --quiet || git commit -m "update d8x to ${{ github.ref_name }}"
          git push
